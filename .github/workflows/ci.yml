name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api_erronka
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alokairu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alokairu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/alokairu_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/alokairu_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Run tests
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v

  web:
    name: Web lint and layout
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - name: Check shared layout
        run: npm run layout:check
      - name: Check formatting
        run: npm run format:check

  admin:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_atala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin_atala/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
