name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api_erronka
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v

  admin:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_atala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin_atala/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
