<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Tu hoja de estilos personalizada -->
    <link rel="stylesheet" href="css/erregistroak.css">
</head>

<body>
    <header></header>

    <main class="d-flex flex-column align-items-center justify-content-center min-vh-100">
        
        <!-- 1. Botón para abrir el pop-up adaptado al diseño -->
        <button popovertarget="Reserva" class="btn btn-outline-light btn-lg shadow">
            Reservar Ahora
        </button>

        <!-- 2. Contenido del Pop-up con temas oscuros de Bootstrap -->
        <div id="Reserva" popover class="popover-personalizado">
            <div class="card bg-dark text-light border-secondary shadow-lg style-container">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/img3.webp"
                    class="card-img-top w-100" alt="Sample photo">
                
                <div class="card-body p-4 p-md-5">
                    <h3 class="mb-4 text-center fw-bold">Registration Info</h3>

                    <form>
                        <!-- Input: Nombre -->
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-semibold" for="form3Example1q">Name</label>
                            <input type="text" id="form3Example1q" class="form-control bg-secondary-subtle text-white border-secondary" placeholder="John Doe" />
                        </div>

                        <div class="row">
                            <!-- Input: Fecha -->
                            <div class="col-md-6 mb-4">
                                <label for="exampleDatepicker1" class="form-label text-secondary small fw-semibold">Select a date</label>
                                <input type="date" class="form-control bg-secondary-subtle text-white border-secondary" id="exampleDatepicker1" />
                            </div>
                            
                            <!-- Input: Género -->
                            <div class="col-md-6 mb-4">
                                <label class="form-label text-secondary small fw-semibold">Gender</label>
                                <select class="form-select bg-secondary-subtle text-white border-secondary">
                                    <option value="" disabled selected>Select...</option>
                                    <option value="female">Female</option>
                                    <option value="male">Male</option>
                                </select>
                            </div>
                        </div>

                        <!-- Input: Código de registro -->
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-semibold" for="form3Example1w">Registration code</label>
                            <input type="text" id="form3Example1w" class="form-control bg-secondary-subtle text-white border-secondary" placeholder="X-12345" />
                        </div>

                        <!-- Botón de Envío -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg mt-2">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <footer></footer>
</body>

</html>
