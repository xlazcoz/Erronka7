<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/dialogos.css">
  <title>Document</title>
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
      <div class="container">
        <a class="navbar-brand logo" href="index.html">
          <img src="https://assets.footylogos.com/logos/rayo-vallecano-white-logo-footylogos.png" alt="Logo">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav4">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav4">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Estaciones</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Erabiltzailea.html">Cuenta</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-outline-primary ms-md-2 mt-2 mt-md-0" href="Login.html" id="btnCuenta">Iniciar Sesión</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <script src="js/api.js"></script>
    <script src="js/dialogos.js"></script>
    <script src="js/auth.js"></script>
  </header>
  <main>
    <div id="authMessage" class="container mt-3" role="alert" aria-live="polite"></div>
    <div id="Login">
      <section class=" bg-image">
        <div class="mask d-flex align-items-center h-100 gradient-custom-3">
          <div class="container h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
              <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                <div class="card" style="border-radius: 15px;">
                  <div class="card-body p-5">
                    <h2 class="text-uppercase text-center mb-5">Iniciar sesion</h2>

                    <form id="loginForm">

                      <div data-mdb-input-init class="form-outline mb-4">
                        <label class="form-label" for="Email">Email</label>
                        <input type="email" id="Email" class="form-control form-control-lg text-white" required />

                      </div>

                      <div data-mdb-input-init class="form-outline mb-4">
                        <label class="form-label" for="loginPassword">Contraseña</label>
                        <input type="password" id="loginPassword" class="form-control form-control-lg text-white"
                          required />

                      </div>

                      <div class="form-check d-flex justify-content-center mb-5">
                        <input class="form-check-input me-2" type="checkbox" value="" id="loginTerms" />
                        <label class="form-check-label" for="loginTerms">
                          Estoy de acuerdo con los <a href="#!" class="text-white"><u>Terminos y condiciones</u></a>
                        </label>
                      </div>

                      <div class="d-flex justify-content-center ">
                        <button type="submit" data-mdb-button-init data-mdb-ripple-init
                          class="btn btn-outline-primary btn-block btn-lg gradient-custom-4 text-white">Login </button>
                      </div>

                      <p class="text-center text-white mt-5 mb-0">¿No tienes cuenta? <a href="#!"
                          class="fw-bold text-white"><u onclick="registrar()">Registrate aqui</u></a></p>

                    </form>

                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="Registrarse" style="display: none;">
      <section class=" bg-image">
        <div class="mask d-flex align-items-center h-100 gradient-custom-3">
          <div class="container h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
              <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                <div class="card" style="border-radius: 15px;">
                  <div class="card-body p-5">
                    <h2 class="text-uppercase text-center mb-5">Registrarse</h2>

                    <form id="registerForm">

                      <div data-mdb-input-init class="form-outline mb-4">
                        <label class="form-label" for="registerName">Nombre</label>
                        <input type="text" id="registerName" class="form-control form-control-lg text-white" required
                          minlength="2" />

                      </div>

                      <div data-mdb-input-init class="form-outline mb-4">
                        <label class="form-label" for="Email2">Email</label>
                        <input type="email" id="Email2" class="form-control form-control-lg text-white" required />

                      </div>

                      <div data-mdb-input-init class="form-outline mb-4">
                        <label class="form-label" for="registerPassword">Contraseña</label>
                        <input type="password" id="registerPassword" class="form-control form-control-lg text-white"
                          required minlength="2" />

                      </div>

                      <div data-mdb-input-init class="form-outline mb-4">
                        <label class="form-label" for="repeatPassword">Repetir contraseña</label>
                        <input type="password" id="repeatPassword" class="form-control form-control-lg text-white"
                          required />

                      </div>

                      <div class="form-check d-flex justify-content-center mb-5">
                        <input class="form-check-input me-2" type="checkbox" value="" id="registerTerms" />
                        <label class="form-check-label" for="registerTerms">
                          Estoy de acuerdo con los <a href="#!" class="text-white"><u>Terminos y condiciones</u></a>
                        </label>
                      </div>

                      <div class="d-flex justify-content-center ">
                        <button type="submit" data-mdb-button-init data-mdb-ripple-init
                          class="btn btn-outline-primary btn-block btn-lg gradient-custom-4 text-white">Registrar</button>
                      </div>

                      <p class="text-center text-white mt-5 mb-0">¿Ya tienes una cuenta? <a href="#!"
                          class="fw-bold text-white"><u onclick="iniciarSesion()">Inicia sesion aqui</u></a></p>

                    </form>

                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <footer class=" text-light mt-auto py-5" data-bs-theme="dark">
    <div class="container text-center">
      <h5 class="mb-3">POWERBANK</h5>
      <ul class="list-inline small mb-3">
                <li class="list-inline-item"><a class="link-secondary text-decoration-none" href="index.html">Estaciones</a></li>
                <li class="list-inline-item mx-3"><a class="link-secondary text-decoration-none" href="#"> </a>
                </li>
                <li class="list-inline-item"><a class="link-secondary text-decoration-none" href="#"> </a></li>
                <li class="list-inline-item mx-3"><a class="link-secondary text-decoration-none" href="erabiltzailea.html">Cuenta</a>
                </li>
            </ul>
      <span class="text-body-secondary small">&copy; 2026 Powerbank Inc.</span>
    </div>
  </footer>

  <script src="js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
