<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kargagune</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/kargagunea.css">
    <link rel="stylesheet" href="css/dialogos.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
            <div class="container">
                <a class="navbar-brand logo" href="index.html">
                    <img src="https://assets.footylogos.com/logos/rayo-vallecano-white-logo-footylogos.png" alt="Logo">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav4">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav4">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Estaciones</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Erabiltzailea.html">Cuenta</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-primary ms-md-2 mt-2 mt-md-0" href="Login.html"
                                id="btnCuenta">Iniciar Sesión</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <script src="js/api.js"></script>
        <script src="js/dialogos.js"></script>
        <script src="js/auth.js"></script>
    </header>

    <main class="container my-4">

        <div class="info row align-items-center g-4">

            <div class="col-12 col-lg-6 d-flex justify-content-center">
                <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0"
                            class="active" aria-current="true" aria-label="Slide 1"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                            aria-label="Slide 2"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                            aria-label="Slide 3"></button>
                    </div>
                    <div class="carousel-inner shadow-sm">
                        <div class="carousel-item active">
                            <img id="imagen1"
                                src="https://upload.wikimedia.org/wikipedia/commons/d/de/El_Peine_del_Viento_en_Donostia-San_Sebasti%C3%A1n.jpg"
                                class="d-block w-100" alt="Peine del Viento">
                        </div>
                        <div class="carousel-item">
                            <img id="imagen2"
                                src="https://i.pinimg.com/736x/81/67/1b/81671be0a66a32abe4442b902d5b2455.jpg"
                                class="d-block w-100" alt="Puente de Zurriola">
                        </div>
                        <div class="carousel-item">
                            <img id="imagen3"
                                src="https://i.pinimg.com/736x/70/59/c9/7059c9b99717f630694c4f8a4320d003.jpg"
                                class="d-block w-100" alt="La Concha">
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>

            <div class="col-12 col-lg-6 d-flex flex-column align-items-center">

                <div class="titulo">
                    <h1 id="titulo">KARGAGUNEA_ZUBIETA</h1>
                </div>

                <div class="texto">


                    <div class="estado align-items-center gap-2 mb-3">
                        <div id="mi-circulo" class="bg-success rounded-circle" style="width: 25px; height: 25px;"></div>
                        <div class="estadotxt m-0">
                            <p class="m-0 fs-5" id="estado"> </p>
                        </div>
                    </div>

                    <div class="direccion mb-4">
                        <ul class="list-unstyled m-0">
                            <li><a href="https://www.google.es/maps" target="_blank" class="fs-5 text-decoration-none"
                                    id="maps">📍 Dirección</a></li>
                        </ul>
                    </div>

                    <div class="mb-4">
                        <h5 class="fs-6 mb-2">Karga postuak</h5>
                        <div id="kargaPostuak" class="d-flex flex-wrap gap-2"></div>
                    </div>

                    <div class="boton mt-auto">
                        <button type="button" id="reservationButton" popovertarget="Reserva"
                            class="btn btn-outline-primary btn-lg w-100">Reservar</button>
                    </div>
                </div>
            </div>

        </div>

        <div id="Reserva" popover class="popover-personalizado">
            <div class="card bg-dark text-light border-secondary shadow-lg style-container">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/img3.webp"
                    class="card-img-top w-100" alt="Sample photo">

                <div class="card-body p-4 p-md-5">
                    <h3 class="mb-4 text-center fw-bold">RESERVAR</h3>

                    <form id="reservationForm">
                        <div class="row">
                            <div class="col-12 col-md-6 mb-4">
                                <label for="FechaReserva" class="form-label text-secondary small fw-semibold">Fecha de
                                    reserva</label>
                                <input type="date" class="form-control bg-secondary-subtle text-white border-secondary"
                                    id="FechaReserva" required />
                            </div>

                            <div class="col-12 col-md-6 mb-4">
                                <label for="horaReserva" class="form-label text-secondary small fw-semibold">Hora de
                                    reserva</label>
                                <input type="time" class="form-control bg-secondary-subtle text-white border-secondary"
                                    id="horaReserva" required />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-semibold" for="HoraDevolucion">Hora de
                                devolucion</label>
                            <input type="time" id="HoraDevolucion"
                                class="form-control bg-secondary-subtle text-white border-secondary" required />
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-semibold" for="KargaPostua">Karga postua</label>
                            <select id="KargaPostua"
                                class="form-select bg-secondary-subtle text-white border-secondary" required>
                                <option value="">Aukeratu data eta ordua lehenago</option>
                            </select>
                            <small id="erabilgarritasunMezua" class="text-secondary"></small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-outline-primary btn-lg mt-2">Confirmar reserva</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/puesto.js"></script>

    <footer class=" text-light mt-auto py-5" data-bs-theme="dark">
        <div class="container text-center">
            <h5 class="mb-3">POWERBANK</h5>
            <ul class="list-inline small mb-3">
                <li class="list-inline-item"><a class="link-secondary text-decoration-none" href="index.html">Estaciones</a></li>
                <li class="list-inline-item mx-3"><a class="link-secondary text-decoration-none" href="#"> </a>
                </li>
                <li class="list-inline-item"><a class="link-secondary text-decoration-none" href="#"> </a></li>
                <li class="list-inline-item mx-3"><a class="link-secondary text-decoration-none" href="erab">Cuenta</a>
                </li>
            </ul>
            <span class="text-body-secondary small">&copy; 2026 Powerbank Inc.</span>
        </div>
    </footer>


</body>

</html>
