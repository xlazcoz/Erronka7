<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
    <div>
      <h2 class="section-heading mb-1">Erabiltzaileen kudeaketa</h2>
      <p class="text-muted mb-0">
        Erabiltzaileak sortu, datuak aldatu, rolak kudeatu eta ezabatu.
      </p>
    </div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary" (click)="kargatu()">
        Berritu
      </button>
      <button type="button" class="btn btn-primary" (click)="irekiSortu()">
        Erabiltzailea sortu
      </button>
    </div>
  </div>

  @if (feedback(); as alerta) {
    <div
      class="alert d-flex align-items-center justify-content-between"
      [class.alert-success]="alerta.mota === 'ok'"
      [class.alert-danger]="alerta.mota === 'error'"
      role="alert"
    >
      <span>{{ alerta.testua }}</span>
      <button type="button" class="btn-close" aria-label="Itxi" (click)="itxiFeedback()"></button>
    </div>
  }

  <hub-table
    [data]="users()"
    [headers]="headers"
    [totalItems]="totalItems()"
    [(page)]="currentPage"
    [(perPage)]="perPage"
    [loading]="isLoading()"
    [searchable]="true"
    [(searchTerm)]="searchTerm"
    [(ordination)]="ordination"
  >
    <ng-template cellTpt header="rola" let-item="item">
      <span class="badge" [ngClass]="rolaKlasa(item.rola)">{{ item.rola }}</span>
    </ng-template>

    <ng-template cellTpt header="ekintzak" let-item="item">
      <span class="accion-icono" title="Datuak aldatu" (click)="irekiAldaketa(item)">
        <img src="icons/edit.svg" alt="Datuak aldatu" />
      </span>
      <span
        class="accion-icono accion-icono--peligro"
        title="Ezabatu"
        (click)="ezabatuErabiltzailea(item)"
      >
        <img src="icons/trash.svg" alt="Ezabatu" />
      </span>
    </ng-template>
  </hub-table>
</div>

<dialog #erabiltzaileaSortu class="kargagune-dialog">
  <form class="row g-3" (ngSubmit)="sortuErabiltzailea()">
    <div class="col-12">
      <h4 class="mb-0">Erabiltzaile berria</h4>
    </div>

    <div class="col-md-6">
      <label for="sortu-izena" class="form-label">Izena</label>
      <input
        type="text"
        class="form-control"
        id="sortu-izena"
        name="sortu-izena"
        [(ngModel)]="erabiltzaileaBerria.izena"
        required
      />
    </div>

    <div class="col-md-6">
      <label for="sortu-abizena" class="form-label">Abizena</label>
      <input
        type="text"
        class="form-control"
        id="sortu-abizena"
        name="sortu-abizena"
        [(ngModel)]="erabiltzaileaBerria.abizena"
        required
      />
    </div>

    <div class="col-md-6">
      <label for="sortu-email" class="form-label">Emaila</label>
      <input
        type="email"
        class="form-control"
        id="sortu-email"
        name="sortu-email"
        [(ngModel)]="erabiltzaileaBerria.login_email"
        required
      />
    </div>

    <div class="col-md-6">
      <label for="sortu-pasahitza" class="form-label">Pasahitza</label>
      <input
        type="password"
        class="form-control"
        id="sortu-pasahitza"
        name="sortu-pasahitza"
        [(ngModel)]="erabiltzaileaBerria.login_pasahitza"
        required
      />
    </div>

    <div class="col-md-6">
      <label for="sortu-rola" class="form-label">Rola</label>
      <select
        class="form-select"
        id="sortu-rola"
        name="sortu-rola"
        [(ngModel)]="erabiltzaileaBerria.rola"
      >
        @for (rola of rolak; track rola) {
          <option [value]="rola">{{ rola }}</option>
        }
      </select>
    </div>

    <div class="col-12 d-flex">
      <button type="submit" class="btn btn-success">Gorde</button>
      <button type="button" class="btn btn-danger ms-auto" (click)="erabiltzaileaSortu.close()">
        Irten
      </button>
    </div>
  </form>
</dialog>

<dialog #erabiltzaileaAldatu class="kargagune-dialog">
  <form class="row g-3" (ngSubmit)="aldatuErabiltzailea()">
    <div class="col-12">
      <h4 class="mb-0">Erabiltzailea aldatu</h4>
    </div>

    <div class="col-md-6">
      <label for="aldatu-izena" class="form-label">Izena</label>
      <input
        type="text"
        class="form-control"
        id="aldatu-izena"
        name="aldatu-izena"
        [(ngModel)]="erabiltzaileaEditatzen.izena"
        required
      />
    </div>

    <div class="col-md-6">
      <label for="aldatu-abizena" class="form-label">Abizena</label>

        type="text"

        id="aldatu-abizena"
        name="aldatu-abizena"
        [(ngModel)]="erabiltzaileaEditatzen.abizena"

    <div class="col-md-6">

      <input
        type="email"
        class="form-control"
        id="aldatu-email"
        name="aldatu-email"
        [(ngModel)]="erabiltzaileaEditatzen.login_email"
        required
      />
    </div>

    <div class="col-md-6">
      <label for="aldatu-pasahitza" class="form-label">Pasahitza berria (aukerakoa)</label>
      <input
        type="password"
        class="form-control"
        id="aldatu-pasahitza"
        name="aldatu-pasahitza"
        [(ngModel)]="erabiltzaileaEditatzen.login_pasahitza"

    </div>

    <div class="col-md-6">
      <label for="aldatu-rola" class="form-label">Rola</label>

        name="aldatu-rola"
        [(ngModel)]="erabiltzaileaEditatzen.rola"
      >
        @for (rola of rolak; track rola) {
          <option [value]="rola">{{ rola }}</option>
        }
      </select>
    </div>

    <div class="col-12 d-flex">
      <button type="submit" class="btn btn-success">Gorde</button>
      <button type="button" class="btn btn-danger ms-auto" (click)="erabiltzaileaAldatu.close()">
        Irten
      </button>
    </div>
  </form>
</dialog>
