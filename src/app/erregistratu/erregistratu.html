<form>
    <div class="mb-3">
        <label for="izena" class="form-label">Izena</label>
        <input type="text" class="form-control" id="izena">
    </div>
    <div class="mb-3">
        <label for="emaila" class="form-label">Emaila</label>
        <input type="email" class="form-control" id="emaila" aria-describedby="emailHelp">
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
    </div>
    <div class="mb-3">
        <label for="pasahitza" class="form-label">Pasahitza</label>
        <input type="password" class="form-control" id="pasahitza">
    </div>
    <button type="submit" class="btn btn-primary" (click)="erregistratuErab()">Erregistratu</button>
</form>
