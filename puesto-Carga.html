            <div class="col-md-6 d-flex flex-column justify-content-center px-md-4">

                <div class="texto d-flex flex-column" style="min-height: 250px;">
                    <div class="numero">
                        <ul class="list-unstyled fs-5">
                            <li><strong>Taquillas libres:</strong> 4</li>
                        </ul>
                    </div>

                    <div class="estado d-flex align-items-center gap-3 mb-4">
                        <div id="mi-circulo" class="bg-success rounded-circle shadow-sm" style="width: 25px; height: 25px; cursor: pointer;"></div>
                        <div class="estadotxt m-0">

                        </div>
                    </div>

                    <div class="direccion mb-4">
                        <ul class="list-unstyled">

                    </div>

                    <div class="boton mt-auto">
                        <button type="button" popovertarget="Reserva" class="btn btn-outline-primary btn-lg w-100">Reservar Ahora</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="Reserva" popover class="popover-personalizado">
            <div class="card bg-dark text-light border-secondary shadow-lg style-container">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/img3.webp"
                    class="card-img-top w-100" alt="Sample photo">
                
                <div class="card-body p-4 p-md-5">
                    <h3 class="mb-4 text-center fw-bold">RESERVAR</h3>

                    <form>
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-semibold" for="form3Example1q">Nombre</label>
                            <input type="text" id="form3Example1q" class="form-control bg-secondary-subtle text-white border-secondary" placeholder="John Doe" />
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="FechaReserva" class="form-label text-secondary small fw-semibold">Fecha de reserva</label>
                                <input type="date" class="form-control bg-secondary-subtle text-white border-secondary" id="FechaReserva" />
                            </div>
                            
                            <div class="col-md-6 mb-4">
                                <label for="horaReserva" class="form-label text-secondary small fw-semibold">Hora de reserva</label>
                                <input type="time" class="form-control bg-secondary-subtle text-white border-secondary" id="horaReserva" />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-semibold" for="HoraDevolucion">Hora de devolucion</label>
                            <input type="time" id="HoraDevolucion" class="form-control bg-secondary-subtle text-white border-secondary"/>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg mt-2">Confirmar Reserva</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </main>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

        const parametros = new URLSearchParams(window.location.search);
        const nombreRecibido = parametros.get('nombre');
        console.log(nombreRecibido);

        const circulo = document.getElementById('mi-circulo');

        circulo.addEventListener('click', () => {
            circulo.classList.toggle('bg-danger');
            circulo.classList.toggle('bg-success');
        });
    </script>
