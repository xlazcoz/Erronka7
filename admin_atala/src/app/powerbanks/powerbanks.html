<div class="container py-4">
  <div class="page-head d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
    <div>
      <span class="pb-eyebrow">Kudeaketa</span>
      <h2 class="section-heading mt-2 mb-1">Powerbank-en kudeaketa</h2>
      <p class="text-muted mb-0">
        Powerbank-ak sortu, karga maila aldatu, takillaz mugitu eta ezabatu.
      </p>
    </div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary" (click)="kargatu()">
        Berritu
      </button>
      <button type="button" class="btn btn-primary" (click)="irekiSortu()">
        Powerbank-a sortu
      </button>
    </div>
  </div>

  @if (feedback(); as alerta) {
    <div
      class="alert d-flex align-items-center justify-content-between"
      [class.alert-success]="alerta.mota === 'ok'"
      [class.alert-danger]="alerta.mota === 'error'"
      role="alert"
    >
      <span>{{ alerta.testua }}</span>
      <button type="button" class="btn-close" aria-label="Itxi" (click)="itxiFeedback()"></button>
    </div>
  }

  <hub-table
    [data]="powerbanks()"
    [headers]="headers"
    [(page)]="currentPage"
    [(perPage)]="perPage"
    [loading]="isLoading()"
    [searchable]="true"
    [(searchTerm)]="searchTerm"
    [(ordination)]="ordination"
  >
    <ng-template cellTpt header="karga_maila" let-item="item">
      <span class="badge" [ngClass]="kargaMailaKlasa(item.karga_maila)">
        {{ item.karga_maila }}%
      </span>
    </ng-template>

    <ng-template cellTpt header="ekintzak" let-item="item">
      <span class="accion-icono" title="Aldatu" (click)="irekiAldaketa(item)">
        <img src="icons/edit.svg" alt="Aldatu" />
      </span>
      <span
        class="accion-icono accion-icono--peligro"
        title="Ezabatu"
        (click)="ezabatuPowerbanka(item)"
      >
        <img src="icons/trash.svg" alt="Ezabatu" />
      </span>
    </ng-template>
  </hub-table>
</div>

<dialog #powerbankSortu class="kargagune-dialog">
  <form class="row g-3" (ngSubmit)="sortuPowerbanka()">
    <div class="col-12">
      <h4 class="mb-0">Powerbank berria</h4>
    </div>

    <div class="col-md-6">
      <label for="sortu-karga-maila" class="form-label">Karga maila (%)</label>
      <input
        type="number"
        class="form-control"
        id="sortu-karga-maila"
        name="sortu-karga-maila"
        min="0"
        max="100"
        [(ngModel)]="powerbankBerria.karga_maila"
        required
      />
    </div>

    <div class="col-md-6">
      <label for="sortu-karga-postua" class="form-label">Karga postua</label>
      <select
        class="form-select"
        id="sortu-karga-postua"
        name="sortu-karga-postua"
        [(ngModel)]="powerbankBerria.karga_postua_id"
        required
      >
        <option [ngValue]="0" disabled>Hautatu takilla bat</option>
        @for (postua of postuak(); track postua.id) {
          <option [ngValue]="postua.id">{{ tokiaEtiketa(postua.id, postuak(), guneak()) }}</option>
        }
      </select>
    </div>

    <div class="col-12 d-flex">
      <button type="submit" class="btn btn-success">Gorde</button>
      <button type="button" class="btn btn-danger ms-auto" (click)="powerbankSortu.close()">
        Irten
      </button>
    </div>
  </form>
</dialog>

<dialog #powerbankAldatu class="kargagune-dialog">
  <form class="row g-3" (ngSubmit)="gordeAldaketa()">
    <div class="col-12">
      <h4 class="mb-0">Powerbank-a aldatu</h4>
    </div>

    <div class="col-md-6">
      <label for="aldatu-karga-maila" class="form-label">Karga maila (%)</label>
      <input
        type="number"
        class="form-control"
        id="aldatu-karga-maila"
        name="aldatu-karga-maila"
        min="0"
        max="100"
        [(ngModel)]="powerbankEditatzen.karga_maila"
        required
      />
    </div>

    <div class="col-md-6">
      <label for="aldatu-karga-postua" class="form-label">Karga postua</label>
      <select
        class="form-select"
        id="aldatu-karga-postua"
        name="aldatu-karga-postua"
        [(ngModel)]="powerbankEditatzen.karga_postua_id"
        required
      >
        @for (postua of postuak(); track postua.id) {
          <option [ngValue]="postua.id">{{ tokiaEtiketa(postua.id, postuak(), guneak()) }}</option>
        }
      </select>
    </div>

    <div class="col-12 d-flex">
      <button type="submit" class="btn btn-success">Gorde</button>
      <button type="button" class="btn btn-danger ms-auto" (click)="powerbankAldatu.close()">
        Irten
      </button>
    </div>
  </form>
</dialog>
