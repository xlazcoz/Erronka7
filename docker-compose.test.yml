services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alokairu_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alokairu_test"]
      interval: 5s
      timeout: 5s
      retries: 10
